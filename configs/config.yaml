paths:
  data: "data"

data:
  batch_size: 32

# LSTM Model hyperparameters
model:
  embed_dim: 300
  hidden_dim: 512
  num_layers: 3
  dropout: 0.5
  bidirectional: true
  lr: 0.0005
  pos_weight: 4

trainer:
  max_epochs: 5

mlflow:
  tracking_uri: "http://127.0.0.1:8080"
  experiment_name: "sms-spam-lstm"
